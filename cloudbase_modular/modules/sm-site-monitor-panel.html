<style>
  @keyframes smShimmer {
    0%   { opacity: 0.4; }
    50%  { opacity: 1;   }
    100% { opacity: 0.4; }
  }
  .sm-skel {
    background: rgba(255,255,255,0.06);
    border-radius: 6px;
    animation: smShimmer 1.6s ease-in-out infinite;
  }
</style>

<!-- ══════════════════════════════════════════════════════
     SITE MONITOR PANEL — inner content for:
     <div id="inst-tab-panel-sitemonitor" style="display:none;">
     Written as a fragment; no html/head/body tags.
     JS entry point: smInit()  |  module: sm-site-monitor.js
════════════════════════════════════════════════════════ -->

<div style="padding: 24px 0;">

  <!-- ── TOP BAR ──────────────────────────────────────────────── -->
  <div style="display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:14px;">

    <!-- Left: Title + subtitle -->
    <div>
      <div style="font-family:var(--font-serif); font-size:1.9rem; font-weight:300; color:#1a9488; line-height:1.1;">
        Site Monitor
      </div>
      <div style="font-family:var(--font-mono); font-size:0.72rem; color:var(--muted); margin-top:5px; letter-spacing:0.04em;">
        Clinical Trial Network &middot; Real-Time Compliance
      </div>
    </div>

    <!-- Right: Search + Refresh -->
    <div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
      <input
        id="sm-search"
        type="text"
        placeholder="Search sites&hellip;"
        style="
          font-family:var(--font-mono);
          font-size:0.78rem;
          background:var(--card);
          border:1px solid var(--border2);
          color:var(--text);
          border-radius:7px;
          padding:8px 14px;
          outline:none;
          width:210px;
          transition:border-color 0.18s;
        "
        onfocus="this.style.borderColor='rgba(26,148,136,0.55)'"
        onblur="this.style.borderColor='var(--border2)'"
      />
      <button
        id="sm-refresh-btn"
        onclick="smInit()"
        title="Refresh site data"
        style="
          font-family:var(--font-mono);
          font-size:1.05rem;
          background:rgba(26,148,136,0.10);
          border:1px solid rgba(26,148,136,0.30);
          color:#1a9488;
          border-radius:7px;
          padding:7px 13px;
          cursor:pointer;
          line-height:1;
          transition:all 0.18s;
        "
        onmouseover="this.style.background='rgba(26,148,136,0.20)';this.style.borderColor='rgba(26,148,136,0.55)'"
        onmouseout="this.style.background='rgba(26,148,136,0.10)';this.style.borderColor='rgba(26,148,136,0.30)'"
      >&#x21BB;</button>
    </div>
  </div>

  <!-- Demo data warning banner (hidden until JS shows it) -->
  <div
    id="sm-demo-banner"
    style="
      display:none;
      font-family:var(--font-mono);
      font-size:0.76rem;
      letter-spacing:0.04em;
      background:rgba(212,168,67,0.10);
      border:1px solid rgba(212,168,67,0.32);
      border-left:3px solid #d4a843;
      color:#d4a843;
      border-radius:8px;
      padding:10px 16px;
      margin-bottom:18px;
    "
  >
    Running on demo data &mdash; no live sites configured for this workspace
  </div>


  <!-- ── ZONE 1: SITE STATUS GRID (full width) ────────────────── -->
  <div
    id="sm-grid-container"
    style="
      background:var(--card);
      border:1px solid var(--border2);
      border-radius:var(--rl);
      overflow:hidden;
      margin-bottom:20px;
    "
  >
    <!-- Loading skeleton: 4 shimmer rows (JS replaces this block) -->
    <div style="padding:16px 20px; display:flex; flex-direction:column; gap:10px;">
      <div class="sm-skel" style="height:38px; border-radius:8px;"></div>
      <div class="sm-skel" style="height:38px; border-radius:8px; opacity:0.85;"></div>
      <div class="sm-skel" style="height:38px; border-radius:8px; opacity:0.70;"></div>
      <div class="sm-skel" style="height:38px; border-radius:8px; opacity:0.55;"></div>
    </div>
  </div>


  <!-- ── ZONE 2: TWO-COLUMN MID SECTION ───────────────────────── -->
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin:20px 0;">

    <!-- Left: Enrollment Funnel -->
    <div
      id="sm-funnel-container"
      style="
        background:var(--card);
        border:1px solid var(--border2);
        border-radius:var(--rl);
        padding:18px 20px;
        overflow:hidden;
      "
    >
      <div style="
        font-family:var(--font-mono);
        font-size:0.68rem;
        letter-spacing:0.16em;
        text-transform:uppercase;
        color:#1a9488;
        margin-bottom:14px;
      ">
        Enrollment Funnel
      </div>
      <!-- Loading skeleton: horizontal bar -->
      <div class="sm-skel" style="height:80px; border-radius:8px;"></div>
    </div>

    <!-- Right: Overdue Assessments -->
    <div
      id="sm-overdue-container"
      style="
        background:var(--card);
        border:1px solid var(--border2);
        border-radius:var(--rl);
        padding:18px 20px;
        overflow:hidden;
      "
    >
      <div style="
        font-family:var(--font-mono);
        font-size:0.68rem;
        letter-spacing:0.16em;
        text-transform:uppercase;
        color:#d4a843;
        margin-bottom:14px;
      ">
        Overdue Assessments
      </div>
      <!-- Loading skeleton: 3 stacked skeleton cards -->
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div class="sm-skel" style="height:32px; border-radius:6px;"></div>
        <div class="sm-skel" style="height:32px; border-radius:6px; opacity:0.80;"></div>
        <div class="sm-skel" style="height:32px; border-radius:6px; opacity:0.60;"></div>
      </div>
    </div>

  </div>


  <!-- ── ZONE 3: PROTOCOL TIMELINE (full width) ───────────────── -->
  <div
    id="sm-gantt-container"
    style="
      background:var(--card);
      border:1px solid var(--border2);
      border-radius:var(--rl);
      padding:18px 20px;
      overflow:hidden;
      margin-bottom:20px;
    "
  >
    <div style="
      font-family:var(--font-mono);
      font-size:0.68rem;
      letter-spacing:0.16em;
      text-transform:uppercase;
      color:#1a9488;
      margin-bottom:14px;
    ">
      Protocol Timeline
    </div>
    <!-- Horizontal scrollable wrapper; JS writes chart content here -->
    <div style="overflow-x:auto; padding-bottom:4px;">
      <!-- Loading skeleton: wide bar -->
      <div class="sm-skel" style="height:64px; min-width:600px; border-radius:8px;"></div>
    </div>
  </div>

</div><!-- /padding wrapper -->


<!-- ── QUERY CONFIRMATION TOAST (fixed, portal-level) ───────── -->
<div
  id="sm-query-toast"
  style="
    display:none;
    position:fixed;
    bottom:28px;
    right:28px;
    z-index:99990;
    font-family:var(--font-mono);
    font-size:0.76rem;
    letter-spacing:0.04em;
    background:rgba(8,14,26,0.96);
    border:1px solid rgba(26,148,136,0.50);
    border-left:3px solid #1a9488;
    color:rgba(200,224,232,0.92);
    border-radius:10px;
    padding:13px 20px;
    backdrop-filter:blur(12px);
    box-shadow:0 6px 28px rgba(0,0,0,0.45);
    max-width:340px;
    pointer-events:none;
  "
>
  Query flagged &mdash; site coordinator will be notified.
</div>
